backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "Сайт"
    files:
      - name: "site"
        label: "Главная страница"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Основное"
            name: "site"
            widget: "object"
            fields:
              - { label: "Название вкладки", name: "title", widget: "string" }
              - { label: "Описание для поиска", name: "description", widget: "text" }
              - { label: "Логотип / название", name: "brand", widget: "string" }
              - label: "Цвета"
                name: "colors"
                widget: "object"
                fields:
                  - { label: "Тёмно-зелёный HEX", name: "forest", widget: "string" }
                  - { label: "Лаймовый HEX", name: "lime", widget: "string" }
                  - { label: "Светлый фон HEX", name: "cream", widget: "string" }
                  - { label: "Текст HEX", name: "ink", widget: "string" }

          - label: "Первый экран"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Маленький текст сверху", name: "eyebrow", widget: "string" }
              - { label: "Заголовок — строка 1", name: "line1", widget: "string" }
              - { label: "Заголовок — строка 2", name: "line2", widget: "string" }
              - { label: "Заголовок — акцент", name: "line3", widget: "string" }
              - { label: "Описание", name: "lead", widget: "text" }
              - { label: "Главное фото", name: "main_image", widget: "image" }
              - { label: "Маленькое фото", name: "small_image", widget: "image" }

          - label: "Названия категорий портфолио"
            name: "category_labels"
            widget: "object"
            fields:
              - { label: "Мероприятия", name: "event", widget: "string" }
              - { label: "Свадьбы", name: "wedding", widget: "string" }
              - { label: "Бизнес", name: "business", widget: "string" }
              - { label: "Портреты", name: "portrait", widget: "string" }

          - label: "Портфолио"
            name: "portfolio"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Название работы", name: "title", widget: "string" }
              - label: "Категория"
                name: "category"
                widget: "select"
                options:
                  - { label: "Мероприятия", value: "event" }
                  - { label: "Свадьбы", value: "wedding" }
                  - { label: "Бизнес", value: "business" }
                  - { label: "Портреты", value: "portrait" }
              - { label: "Фотография", name: "image", widget: "image" }
              - { label: "Описание фото (alt)", name: "alt", widget: "string", required: false }
              - label: "Размер карточки"
                name: "size"
                widget: "select"
                default: "normal"
                options:
                  - { label: "Обычная", value: "normal" }
                  - { label: "Широкая", value: "wide" }
                  - { label: "Высокая", value: "tall" }

          - label: "Направления"
            name: "services"
            widget: "list"
            fields:
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }
              - label: "Связанная категория"
                name: "filter"
                widget: "select"
                options: ["event", "wedding", "business", "portrait"]
              - { label: "Теги", name: "tags", widget: "list", field: { label: "Тег", name: "tag", widget: "string" } }

          - label: "Как проходит работа"
            name: "process"
            widget: "list"
            fields:
              - { label: "Название шага", name: "title", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }

          - label: "Цены и калькулятор"
            name: "prices"
            widget: "list"
            min: 1
            fields:
              - { label: "Служебный ID", name: "key", widget: "string", hint: "Например: photo" }
              - { label: "Метка", name: "label", widget: "string", hint: "Например: PHOTO" }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }
              - { label: "Цена за час", name: "rate", widget: "number", value_type: "int", min: 0 }
              - { label: "Плашка", name: "pill", widget: "string", required: false }
              - { label: "Выделить карточку", name: "featured", widget: "boolean", default: false }
              - { label: "Текст кнопки", name: "cta", widget: "string" }

          - label: "Команда"
            name: "team"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Имя", name: "name", widget: "string" }
              - label: "Роль"
                name: "role"
                widget: "select"
                options: ["Фотограф", "Видеограф", "Фото + видео", "Продюсер", "Ретушёр", "Монтажёр"]
              - { label: "Описание", name: "description", widget: "text" }
              - { label: "Фото", name: "image", widget: "image" }
              - { label: "Теги", name: "tags", widget: "list", field: { label: "Тег", name: "tag", widget: "string" } }

          - label: "Контакты"
            name: "contacts"
            widget: "object"
            fields:
              - { label: "Заголовок — строка 1", name: "line1", widget: "string" }
              - { label: "Заголовок — акцент", name: "line2", widget: "string" }
              - { label: "Описание", name: "lead", widget: "text" }
              - { label: "Текст главной кнопки", name: "primary_label", widget: "string" }
              - { label: "Ссылка главной кнопки", name: "primary_href", widget: "string", hint: "mailto:, https://t.me/... или любая ссылка" }
              - label: "Контакты"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Подпись", name: "label", widget: "string" }
                  - { label: "Что показывать", name: "value", widget: "string" }
                  - { label: "Ссылка", name: "href", widget: "string", hint: "tel:+..., mailto:..., https://..." }
              - { label: "E-mail для кнопки «копировать»", name: "copy_email", widget: "string", required: false }
