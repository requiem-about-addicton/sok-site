backend:
  name: github
  repo: requiem-about-addicton/sok-site
  branch: main

media_folder: "sok with adm panel/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "Сайт"
    files:
      - name: "site"
        label: "Главная страница"
        file: "sok with adm panel/content/site.json"
        format: "json"
fields:
  - label: "01 · Сайт и глобальный стиль"
    name: "site"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Название вкладки браузера", name: "title", widget: "string", required: false }
      - { label: "SEO-описание", name: "description", widget: "text", required: false }
      - { label: "Текстовое название бренда", name: "brand", widget: "string", required: false }
      - { label: "PNG/SVG логотип", name: "logo", widget: "image", required: false, hint: "Если заполнено — заменяет текстовое название в шапке." }
      - { label: "Alt логотипа", name: "logo_alt", widget: "string", required: false }
      - { label: "Ширина логотипа, px", name: "logo_width", widget: "number", value_type: "int", min: 30, max: 400, required: false }
      - { label: "Favicon", name: "favicon", widget: "image", required: false }
      - { label: "Цвет браузерной темы", name: "theme_color", widget: "string", required: false, hint: "HEX, например #073d2c" }
      - { label: "Шрифт сайта", name: "font_family", widget: "string", required: false, hint: "CSS font-family, например Inter, Arial, sans-serif" }
      - label: "Палитра сайта"
        name: "colors"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Основной тёмно-зелёный", name: "forest", widget: "string", required: false }
          - { label: "Зелёный акцент 2", name: "forest_2", widget: "string", required: false }
          - { label: "Самый тёмный зелёный", name: "forest_3", widget: "string", required: false }
          - { label: "Лаймовый", name: "lime", widget: "string", required: false }
          - { label: "Светлый лайм", name: "lime_soft", widget: "string", required: false }
          - { label: "Мятный", name: "mint", widget: "string", required: false }
          - { label: "Основной светлый фон", name: "cream", widget: "string", required: false }
          - { label: "Белый/бумажный фон", name: "paper", widget: "string", required: false }
          - { label: "Основной текст", name: "ink", widget: "string", required: false }
          - { label: "Вторичный текст", name: "muted", widget: "string", required: false }
      - label: "Размеры и эффекты"
        name: "layout"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Макс. ширина контента, px", name: "container_width", widget: "number", value_type: "int", min: 800, max: 1800, required: false }
          - { label: "Вертикальный отступ секций, px", name: "section_padding", widget: "number", value_type: "int", min: 20, max: 260, required: false }
          - { label: "Скругление карточек, px", name: "radius", widget: "number", value_type: "int", min: 0, max: 80, required: false }
          - { label: "Макс. размер заголовка первого экрана, px", name: "hero_title_max", widget: "number", value_type: "int", min: 70, max: 260, required: false }
          - { label: "Макс. размер заголовков секций, px", name: "section_title_max", widget: "number", value_type: "int", min: 40, max: 180, required: false }
          - { label: "Базовый размер текста, px", name: "body_size", widget: "number", value_type: "int", min: 12, max: 24, required: false }
          - label: "Порядок блоков главной"
            name: "section_order"
            widget: "list"
            required: false
            hint: "Перетаскивай строки. Допустимые ID: top, ticker, services, portfolio, team, process, prices, contacts"
            field: { label: "ID блока", name: "section", widget: "string", required: false }
          - { label: "Анимации", name: "animations", widget: "boolean", default: true, required: false }
          - { label: "Свечение за курсором", name: "cursor_glow", widget: "boolean", default: true, required: false }

  - label: "02 · Шапка и меню"
    name: "header"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать шапку", name: "enabled", widget: "boolean", default: true, required: false }
      - label: "Пункты меню"
        name: "nav"
        widget: "list"
        collapsed: true
        summary: "{{fields.label}} → {{fields.href}}"
        fields:
          - { label: "Текст", name: "label", widget: "string", required: false }
          - { label: "Ссылка", name: "href", widget: "string", required: false, hint: "Например #team" }
      - { label: "Текст кнопки справа", name: "cta_label", widget: "string", required: false }
      - { label: "Ссылка кнопки", name: "cta_href", widget: "string", required: false }
      - { label: "Подпись в мобильном меню слева", name: "mobile_footer_left", widget: "string", required: false }
      - { label: "Подпись в мобильном меню справа", name: "mobile_footer_right", widget: "string", required: false }
      - { label: "Фон шапки после прокрутки", name: "background_scrolled", widget: "string", required: false, hint: "Можно HEX или rgba(...)" }

  - label: "03 · Первый экран"
    name: "hero"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать блок", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Маленькая подпись", name: "eyebrow", widget: "string", required: false }
      - { label: "Заголовок — строка 1", name: "line1", widget: "string", required: false }
      - { label: "Заголовок — строка 2", name: "line2", widget: "string", required: false }
      - { label: "Заголовок — акцентная строка", name: "line3", widget: "string", required: false }
      - { label: "Описание", name: "lead", widget: "text", required: false }
      - { label: "Главная кнопка — текст", name: "primary_label", widget: "string", required: false }
      - { label: "Главная кнопка — ссылка", name: "primary_href", widget: "string", required: false }
      - { label: "Вторая кнопка — текст", name: "secondary_label", widget: "string", required: false }
      - { label: "Вторая кнопка — ссылка", name: "secondary_href", widget: "string", required: false }
      - { label: "Большое фото", name: "main_image", widget: "image", required: false }
      - { label: "Alt большого фото", name: "main_alt", widget: "string", required: false }
      - { label: "Маленькое фото", name: "small_image", widget: "image", required: false }
      - { label: "Alt маленького фото", name: "small_alt", widget: "string", required: false }
      - { label: "Круглая наклейка — строка 1", name: "sticker_line1", widget: "string", required: false }
      - { label: "Круглая наклейка — строка 2", name: "sticker_line2", widget: "string", required: false }
      - label: "Белые мини-плашки"
        name: "badges"
        widget: "list"
        required: false
        field: { label: "Текст", name: "badge", widget: "string", required: false }
      - label: "Хэштеги/быстрые фильтры"
        name: "tags"
        widget: "list"
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: "Текст", name: "label", widget: "string", required: false }
          - { label: "Категория фильтра", name: "filter", widget: "string", required: false }
          - { label: "Ссылка", name: "href", widget: "string", required: false, hint: "Обычно #portfolio" }
      - { label: "Текст подсказки прокрутки", name: "scroll_label", widget: "string", required: false }
      - { label: "Куда ведёт подсказка", name: "scroll_href", widget: "string", required: false }
      - label: "Фон и декор первого экрана"
        name: "background"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Цвет фона", name: "color", widget: "string", required: false }
          - { label: "Фоновая картинка", name: "image", widget: "image", required: false }
          - { label: "Затемнение картинки 0–0.95", name: "overlay", widget: "number", value_type: "float", min: 0, max: 0.95, step: 0.05, required: false }
          - { label: "Позиция фоновой картинки", name: "position", widget: "string", required: false, hint: "Например center center или 50% 20%" }
          - label: "Размер фоновой картинки"
            name: "size"
            widget: "select"
            required: false
            options: ["cover", "contain", "auto"]
          - { label: "Цвет лаймового круга", name: "blob_color", widget: "string", required: false }
          - { label: "Показывать декоративные круги", name: "show_blobs", widget: "boolean", default: true, required: false }
          - { label: "Показывать шум", name: "show_noise", widget: "boolean", default: true, required: false }

  - label: "04 · Бегущая строка"
    name: "ticker"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать", name: "enabled", widget: "boolean", default: true, required: false }
      - label: "Слова"
        name: "items"
        widget: "list"
        required: false
        field: { label: "Слово", name: "item", widget: "string", required: false }
      - { label: "Разделитель", name: "separator", widget: "string", required: false }
      - { label: "Цвет фона", name: "background_color", widget: "string", required: false }
      - { label: "Цвет текста", name: "text_color", widget: "string", required: false }
      - { label: "Скорость полного прохода, сек", name: "speed_seconds", widget: "number", value_type: "int", min: 3, max: 120, required: false }

  - label: "05 · Блок «Не просто красиво»"
    name: "services_section"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать блок", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Маленькая подпись", name: "eyebrow", widget: "string", required: false }
      - { label: "Заголовок — обычная строка", name: "heading_line1", widget: "string", required: false }
      - { label: "Заголовок — акцентная строка", name: "heading_line2", widget: "string", required: false }
      - { label: "Описание", name: "lead", widget: "text", required: false }
      - { label: "Цвет текста", name: "text_color", widget: "string", required: false }
      - { label: "Цвет вторичного текста", name: "muted_color", widget: "string", required: false }
      - label: "Фон"
        name: "background"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Цвет", name: "color", widget: "string", required: false }
          - { label: "Картинка", name: "image", widget: "image", required: false }
          - { label: "Затемнение 0–0.95", name: "overlay", widget: "number", value_type: "float", min: 0, max: 0.95, step: 0.05, required: false }
          - { label: "Позиция", name: "position", widget: "string", required: false }
          - { label: "Размер", name: "size", widget: "select", options: ["cover", "contain", "auto"], required: false }

  - label: "06 · Направления"
    name: "services"
    widget: "list"
    collapsed: true
    summary: "{{fields.title}}"
    fields:
      - { label: "Показывать", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Название", name: "title", widget: "string", required: false }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Категория портфолио", name: "filter", widget: "string", required: false, hint: "event / wedding / business / portrait или своя" }
      - { label: "Символ справа", name: "link_label", widget: "string", required: false }
      - label: "Теги"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Тег", name: "tag", widget: "string", required: false }

  - label: "07 · Заголовок портфолио"
    name: "portfolio_section"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать блок", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Маленькая подпись", name: "eyebrow", widget: "string", required: false }
      - { label: "Заголовок — строка 1", name: "heading_line1", widget: "string", required: false }
      - { label: "Заголовок — строка 2", name: "heading_line2", widget: "string", required: false }
      - { label: "Заголовок — акцент", name: "heading_accent", widget: "string", required: false }
      - { label: "Описание", name: "lead", widget: "text", required: false }
      - { label: "Кнопка «Все работы»", name: "all_label", widget: "string", required: false }
      - { label: "Цвет текста", name: "text_color", widget: "string", required: false }
      - { label: "Цвет вторичного текста", name: "muted_color", widget: "string", required: false }
      - label: "Фон"
        name: "background"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Цвет", name: "color", widget: "string", required: false }
          - { label: "Картинка", name: "image", widget: "image", required: false }
          - { label: "Затемнение 0–0.95", name: "overlay", widget: "number", value_type: "float", min: 0, max: 0.95, step: 0.05, required: false }
          - { label: "Позиция", name: "position", widget: "string", required: false }
          - { label: "Размер", name: "size", widget: "select", options: ["cover", "contain", "auto"], required: false }

  - label: "08 · Названия категорий портфолио"
    name: "category_labels"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Мероприятия", name: "event", widget: "string", required: false }
      - { label: "Свадьбы", name: "wedding", widget: "string", required: false }
      - { label: "Бизнес", name: "business", widget: "string", required: false }
      - { label: "Портреты", name: "portrait", widget: "string", required: false }

  - label: "09 · Карточки портфолио"
    name: "portfolio"
    widget: "list"
    collapsed: true
    summary: "{{fields.title}} — {{fields.category}}"
    fields:
      - { label: "Показывать", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Название работы", name: "title", widget: "string", required: false }
      - { label: "Категория", name: "category", widget: "string", required: false }
      - { label: "Фотография", name: "image", widget: "image", required: false }
      - { label: "Alt изображения", name: "alt", widget: "string", required: false }
      - label: "Размер карточки"
        name: "size"
        widget: "select"
        default: "normal"
        required: false
        options:
          - { label: "Обычная", value: "normal" }
          - { label: "Широкая", value: "wide" }
          - { label: "Высокая", value: "tall" }
      - { label: "Позиция фото", name: "object_position", widget: "string", required: false, hint: "Например center center, 50% 20%, left top" }

  - label: "10 · Заголовок команды"
    name: "team_section"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать блок", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Маленькая подпись", name: "eyebrow", widget: "string", required: false }
      - { label: "Заголовок — строка 1", name: "heading_line1", widget: "string", required: false }
      - { label: "Заголовок — акцент", name: "heading_line2", widget: "string", required: false }
      - { label: "Описание", name: "lead", widget: "text", required: false }
      - { label: "Подпись стрелки назад", name: "prev_label", widget: "string", required: false }
      - { label: "Подпись стрелки вперёд", name: "next_label", widget: "string", required: false }
      - { label: "Подсказка слева", name: "swipe_left", widget: "string", required: false }
      - { label: "Подсказка справа", name: "swipe_right", widget: "string", required: false }
      - { label: "Цвет текста", name: "text_color", widget: "string", required: false }
      - { label: "Цвет вторичного текста", name: "muted_color", widget: "string", required: false }
      - label: "Фон"
        name: "background"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Цвет", name: "color", widget: "string", required: false }
          - { label: "Картинка", name: "image", widget: "image", required: false }
          - { label: "Затемнение 0–0.95", name: "overlay", widget: "number", value_type: "float", min: 0, max: 0.95, step: 0.05, required: false }
          - { label: "Позиция", name: "position", widget: "string", required: false }
          - { label: "Размер", name: "size", widget: "select", options: ["cover", "contain", "auto"], required: false }

  - label: "11 · Команда — люди"
    name: "team"
    widget: "list"
    collapsed: true
    summary: "{{fields.name}} — {{fields.role}}"
    fields:
      - { label: "Показывать", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Имя", name: "name", widget: "string", required: false }
      - { label: "Роль", name: "role", widget: "string", required: false }
      - { label: "Плашка на фото", name: "badge", widget: "string", required: false, hint: "Например PHOTO / VIDEO / CREW" }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Фото", name: "image", widget: "image", required: false }
      - { label: "Позиция фото", name: "object_position", widget: "string", required: false }
      - label: "Теги"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Тег", name: "tag", widget: "string", required: false }

  - label: "12 · Заголовок «Как всё происходит»"
    name: "process_section"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать блок", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Маленькая подпись", name: "eyebrow", widget: "string", required: false }
      - { label: "Заголовок — строка 1", name: "heading_line1", widget: "string", required: false }
      - { label: "Заголовок — строка 2", name: "heading_line2", widget: "string", required: false }
      - { label: "Заголовок — акцент", name: "heading_accent", widget: "string", required: false }
      - { label: "Дополнительный текст", name: "lead", widget: "text", required: false }
      - { label: "Цвет текста", name: "text_color", widget: "string", required: false }
      - { label: "Цвет вторичного текста", name: "muted_color", widget: "string", required: false }
      - label: "Фон"
        name: "background"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Цвет", name: "color", widget: "string", required: false }
          - { label: "Картинка", name: "image", widget: "image", required: false }
          - { label: "Затемнение 0–0.95", name: "overlay", widget: "number", value_type: "float", min: 0, max: 0.95, step: 0.05, required: false }
          - { label: "Позиция", name: "position", widget: "string", required: false }
          - { label: "Размер", name: "size", widget: "select", options: ["cover", "contain", "auto"], required: false }

  - label: "13 · Этапы работы"
    name: "process"
    widget: "list"
    collapsed: true
    summary: "{{fields.title}}"
    fields:
      - { label: "Показывать", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Название шага", name: "title", widget: "string", required: false }
      - { label: "Описание", name: "description", widget: "text", required: false }

  - label: "14 · Заголовок блока цен"
    name: "prices_section"
    widget: "object"
    collapsed: true
    fields:
      - { label: "Показывать блок", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Маленькая подпись", name: "eyebrow", widget: "string", required: false }
      - { label: "Заголовок — строка 1", name: "heading_line1", widget: "string", required: false }
      - { label: "Заголовок — акцент", name: "heading_line2", widget: "string", required: false }
      - { label: "Описание", name: "lead", widget: "text", required: false }
      - { label: "Валюта", name: "currency", widget: "string", required: false }
      - { label: "Единица тарифа", name: "unit", widget: "string", required: false, hint: "Например час" }
      - { label: "Цвет текста", name: "text_color", widget: "string", required: false }
      - { label: "Цвет вторичного текста", name: "muted_color", widget: "string", required: false }
      - label: "Фон"
        name: "background"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Цвет", name: "color", widget: "string", required: false }
          - { label: "Картинка", name: "image", widget: "image", required: false }
          - { label: "Затемнение 0–0.95", name: "overlay", widget: "number", value_type: "float", min: 0, max: 0.95, step: 0.05, required: false }
          - { label: "Позиция", name: "position", widget: "string", required: false }
          - { label: "Размер", name: "size", widget: "select", options: ["cover", "contain", "auto"], required: false }

  - label: "15 · Карточки цен"
    name: "prices"
    widget: "list"
    collapsed: true
    summary: "{{fields.title}} — {{fields.rate}}"
    fields:
      - { label: "Показывать", name: "enabled", widget: "boolean", default: true, required: false }
      - { label: "Служебный ID", name: "key", widget: "string", required: false }
      - { label: "Метка сверху", name: "label", widget: "string", required: false }
      - { label: "Название", name: "title", widget: "string", required: false }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Цена за единицу", name: "rate", widget: "number", value_type: "int", min: 0, required: false }
      - { label: "Плашка справа", name: "pill", widget: "string", required: false }
      - { label: "Выделить карточку", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Текст кнопки", name: "cta", widget: "string", required: false }
      - { label: "Ссылка кнопки", name: "cta_href", widget: "string", required: false }
